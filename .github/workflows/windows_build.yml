name: Build DracoonBzh EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywin32
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --clean `
          --name "Dracoon" `
          --icon icon.ico `
          --add-data "src\i18n.json;." `
          --add-data "icon.ico;." `
          --hidden-import win32gui `
          --hidden-import win32con `
          --hidden-import win32api `
          --hidden-import win32process `
          --hidden-import win32com `
          --hidden-import pythoncom `
          --hidden-import winsdk.windows.ui.notifications `
          --hidden-import winsdk.windows.ui.notifications.management `
          --hidden-import winsdk.windows.foundation `
          --hidden-import pystray._win32 `
          --hidden-import PIL `
          --hidden-import PIL.Image `
          --hidden-import PIL.ImageDraw `
          --hidden-import PIL.ImageTk `
          --hidden-import keyboard `
          --hidden-import psutil `
          --hidden-import PyQt6 `
          --hidden-import PyQt6.QtWidgets `
          --hidden-import PyQt6.QtCore `
          --hidden-import PyQt6.QtGui `
          --exclude-module PyQt6.QtWebEngine `
          --exclude-module PyQt6.QtWebEngineCore `
          --exclude-module PyQt6.QtWebEngineWidgets `
          --exclude-module PyQt6.Qt3D `
          --exclude-module PyQt6.QtMultimedia `
          --exclude-module PyQt6.QtNetwork `
          --exclude-module PyQt6.QtSql `
          --exclude-module PyQt6.QtSvg `
          --exclude-module PyQt6.QtQml `
          --exclude-module PyQt6.QtQuick `
          --exclude-module PyQt6.QtBluetooth `
          --exclude-module PyQt6.QtDBus `
          --exclude-module PyQt6.QtDesigner `
          --exclude-module PyQt6.QtHelp `
          --exclude-module PyQt6.QtOpenGL `
          --exclude-module PyQt6.QtPdf `
          --exclude-module PyQt6.QtPositioning `
          --exclude-module PyQt6.QtRemoteObjects `
          --exclude-module PyQt6.QtSensors `
          --exclude-module PyQt6.QtSerialPort `
          --exclude-module PyQt6.QtTest `
          --exclude-module PyQt6.QtXml `
          src/main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DracoonBzh-Windows-EXE
          path: dist/*.exe
